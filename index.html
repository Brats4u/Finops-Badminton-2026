M.filter(m=>m.p2==="WALKOVER").forEach(m=>{if(!R[m.id])R[m.id]=1;});sv();
function gW(id){return R[id]===1?M.find(m=>m.id===id)?.p1:R[id]===2?M.find(m=>m.id===id)?.p2:null;}
function getR2(code){const r1=M.filter(m=>m.cat===code);const r2=[];for(let i=0;i<r1.length;i+=2){if(i+1<r1.length){const w1=gW(r1[i].id),w2=gW(r1[i+1].id);r2.push({id:1000+r1[i].id,cat:code,r:"R2",t:"R2",ct:0,p1:w1||("W#"+r1[i].id),p2:w2||("W#"+r1[i+1].id)});}else{r2.push({id:1000+r1[i].id,cat:code,r:"R2",t:"R2",ct:0,p1:gW(r1[i].id)||("W#"+r1[i].id),p2:"BYE"});}}return r2;}
function getNext(prev,rnd){const nx=[];for(let i=0;i<prev.length;i+=2){if(i+1<prev.length){const w1=R[prev[i].id]===1?prev[i].p1:R[prev[i].id]===2?prev[i].p2:null;const w2=R[prev[i+1].id]===1?prev[i+1].p1:R[prev[i+1].id]===2?prev[i+1].p2:null;nx.push({id:prev[i].id+500,cat:prev[i].cat,r:rnd,t:rnd,ct:0,p1:w1||"TBD",p2:w2||"TBD"});}};return nx;}
function rm(m){const w=R[m.id];const t1=!m.p1||m.p1.startsWith("W#")||m.p1==="TBD";const t2=!m.p2||m.p2.startsWith("W#")||m.p2==="TBD";
return`<div class="m"><div class="mn">${m.id<1000?m.id:"�"}</div><div class="mi">${m.t}<br>Court No# ${m.ct||"�"}</div><div class="ps"><div class="p ${w===1?"w":w===2?"l":""} ${t1?"tbd":""}" onclick="${!t1&&m.p2!=="WALKOVER"&&m.p2!=="BYE"?"setW("+m.id+",1)":""}">${m.p1}</div><span class="vs">VS</span><div class="p ${w===2?"w":w===1?"l":""} ${t2?"tbd":""}" onclick="${!t2&&m.p1!=="WALKOVER"?"setW("+m.id+",2)":""}">${m.p2}</div></div><input class="si" placeholder="S1" value="${R["s1_"+m.id]||""}" onchange="R['s1_'+${m.id}]=this.value;sv();" title="Set 1"><input class="si" placeholder="S2" value="${R["s2_"+m.id]||""}" onchange="R['s2_'+${m.id}]=this.value;sv();" title="Set 2"><input class="si" placeholder="S3" value="${R["s3_"+m.id]||""}" onchange="R['s3_'+${m.id}]=this.value;sv();" title="Set 3"></div>`;}
let lastAction=null;
function setW(id,p){
  if(R[id]===p){delete R[id];lastAction=null;}  // Click same = deselect
  else{lastAction={id,prev:R[id]};R[id]=p;}
  sv();render();updateUndo();
}
function undo(){if(lastAction){if(lastAction.prev)R[lastAction.id]=lastAction.prev;else delete R[lastAction.id];lastAction=null;sv();render();updateUndo();}}
function updateUndo(){const btn=document.getElementById("undoBtn");if(btn)btn.style.display=lastAction?"block":"none";}
function switchTo(i){cur=cats[i];render();}
function cCode(c){return Object.entries(CM).find(([k,v])=>v===c)?.[0]||"";}
function render(){
document.getElementById("tb").innerHTML=cats.map((c,i)=>'<div class="tab'+(c===cur?" active":"")+'" onclick="switchTo('+i+')">'+c+'</div>').join("");
const el=document.getElementById("ct");
if(cur==="Dashboard"){renderD(el);return;}
const code=cCode(cur);const r1=M.filter(m=>m.cat===code);
const r2=getR2(code);const qf=getNext(r2,"QF");const sf=getNext(qf,"SF");const fi=getNext(sf,"Final");
let h='<div class="rt">Round 1 ('+r1.length+' matches)</div>';r1.forEach(m=>{h+=rm(m);});
h+='<div class="rt">Round 2 ('+r2.length+' matches)</div>';r2.forEach(m=>{h+=rm(m);});
if(qf.length>0){h+='<div class="rt">Quarter Final ('+qf.length+')</div>';qf.forEach(m=>{h+=rm(m);});}
if(sf.length>0){h+='<div class="rt">Semi Final ('+sf.length+')</div>';sf.forEach(m=>{h+=rm(m);});}
if(fi.length>0){h+='<div class="rt" style="border-color:gold;color:gold;">?? FINAL</div>';fi.forEach(m=>{h+=rm(m);});}
el.innerHTML=h;}
function renderD(el){
const total=M.length,done=M.filter(m=>R[m.id]).length,pct=Math.round(done/total*100);
const ts={};M.forEach(m=>{if(!ts[m.t])ts[m.t]=[];ts[m.t].push(m);});
const times=Object.keys(ts).sort((a,b)=>{const pa=a.split(":"),pb=b.split(":");return(parseInt(pa[0])*60+parseInt(pa[1]))-(parseInt(pb[0])*60+parseInt(pb[1]));});
let h=`<div class="sts"><div class="sc"><div class="n">${total}</div><div class="lb">Total R1</div></div><div class="sc"><div class="n">${done}</div><div class="lb">Done</div></div><div class="sc"><div class="n">${total-done}</div><div class="lb">Pending</div></div><div class="sc"><div class="n">${pct}%</div><div class="lb">Progress</div></div></div><div class="pb"><div class="pf" style="width:${pct}%"></div></div>`;
h+='<div class="rt">Category Progress</div>';
Object.entries(CM).forEach(([code,name])=>{const cm=M.filter(m=>m.cat===code);const cd=cm.filter(m=>R[m.id]).length;h+=`<div style="display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #333"><span>${name}</span><span style="color:${cd===cm.length?"#4caf50":"#a8d8ea"}">${cd}/${cm.length}</span></div>`;});
// Current slot
let curSlot=null;for(const t of times){if(ts[t].some(m=>!R[m.id])){curSlot=t;break;}}
if(curSlot){const ongoing=ts[curSlot];h+=`<div class="rt green">?? ONGOING � ${curSlot} (${ongoing.filter(m=>!R[m.id]).length} in progress)</div>`;ongoing.sort((a,b)=>a.ct-b.ct).forEach(m=>{const w=R[m.id];h+=`<div class="m"><div class="mn">${m.id}</div><div class="mi">${CM[m.cat]||m.cat}<br>Court No# ${m.ct}</div><div class="ps"><div class="p ${w===1?"w":w===2?"l":""}" onclick="setW(${m.id},1)">${m.p1}</div><span class="vs">VS</span><div class="p ${w===2?"w":w===1?"l":""}" onclick="setW(${m.id},2)">${m.p2}</div></div></div>`;});}
// All time slots
h+='<div class="rt">?? Schedule by Time Slot</div>';
times.forEach(t=>{const sm=ts[t];const cd=sm.filter(m=>R[m.id]).length;const icon=cd===sm.length?"?":cd>0?"??":"?";
h+=`<div class="slot" onclick="this.nextElementSibling.classList.toggle('hidden')"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:#a8d8ea">${icon} ${t}</span><span style="font-size:10px;color:#888">${cd}/${sm.length} done | ${sm.length} courts</span></div></div><div class="slot-matches hidden">`;
sm.sort((a,b)=>a.ct-b.ct).forEach(m=>{const w=R[m.id];const wn=w===1?m.p1:w===2?m.p2:null;h+=`<div style="display:flex;padding:3px 12px;font-size:10px;border-left:3px solid ${w?"#4caf50":"#333"};margin:2px 0"><span style="width:70px;color:#ffd700">Court No# ${m.ct}</span><span style="width:80px;color:#888">${CM[m.cat]||""}</span><span style="flex:1;color:${w?"#4caf50":"#fff"}">${w?"?? "+wn:m.p1+" vs "+m.p2}</span></div>`;});
h+='</div>';});
el.innerHTML=h;}
render();
