const CAT_NAMES = {MS:"Men's Singles",WS:"Women's Singles",MD:"Men's Doubles",WD:"Women's Doubles",XD:"Mixed Doubles"};
const ROUND_ORDER = ['Round 1','Round 2','Round 3','Quarter Final','Semi Final','Final'];
const ROUND_CLASS = {'Round 1':'r1','Round 2':'r2','Round 3':'r3','Quarter Final':'qf','Semi Final':'sf','Final':'final'};
let isAdmin = false;
let currentView = 'dashboard';
let results = {}; // matchNo -> {winner, s1p1, s1p2, s2p1, s2p2, s3p1, s3p2}

// Firebase sync
const resultsRef = db.ref('results');
resultsRef.on('value', snap => {
    results = snap.val() || {};
    render();
});

function toggleAdmin() {
    if (isAdmin) { isAdmin = false; updateAdminUI(); }
    else { document.getElementById('admin-modal').classList.remove('hidden'); document.getElementById('admin-pass').focus(); }
}
function checkPass() {
    if (document.getElementById('admin-pass').value === 'finops2026') {
        isAdmin = true; closeModal(); updateAdminUI();
    } else { alert('Wrong password'); }
}
function closeModal() { document.getElementById('admin-modal').classList.add('hidden'); document.getElementById('admin-pass').value=''; }
function updateAdminUI() {
    const btn = document.getElementById('lock-toggle');
    const lbl = document.getElementById('mode-label');
    if (isAdmin) { btn.className='lock-btn'; btn.innerHTML='&#128274; Lock'; lbl.innerHTML='&#128275; Admin Mode'; lbl.style.color='#4ade80'; }
    else { btn.className='unlock-btn'; btn.innerHTML='&#128275; Unlock Admin'; lbl.innerHTML='&#128274; Viewer Mode'; lbl.style.color='#94a3b8'; }
}

function showView(v) {
    currentView = v;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    const map = {dashboard:'btn-dash',MS:'btn-ms',WS:'btn-ws',MD:'btn-md',WD:'btn-wd',XD:'btn-xd'};
    document.querySelector('.'+map[v]).classList.add('active');
    render();
}

function getWinner(n) { return results[n] ? results[n].winner : null; }
function getScores(n) { return results[n] || {}; }

function setWinner(n, player) {
    if (!isAdmin) return;
    const cur = getWinner(n);
    if (cur === player) { db.ref('results/'+n+'/winner').remove(); } // undo
    else { db.ref('results/'+n+'/winner').set(player); }
}

function setNoShow(n) {
    if (!isAdmin) return;
    const cur = getWinner(n);
    if (cur === 'NO_SHOW') { db.ref('results/'+n+'/winner').remove(); } // undo
    else { db.ref('results/'+n+'/winner').set('NO_SHOW'); }
}

function setScore(n, field, val) {
    if (!isAdmin) return;
    db.ref('results/'+n+'/'+field).set(val);
}

function resolvePlayer(pStr, matchNo) {
    if (!pStr) return pStr;
    const m = pStr.match(/^Winner M#(\d+)$/);
    if (m) {
        const srcMatch = parseInt(m[1]);
        // Check if the source match is a walkover — auto-resolve to the real player
        const srcM = MATCHES.find(x => x.n === srcMatch);
        if (srcM && srcM.p2 === 'WALKOVER') return srcM.p1;
        if (srcM && srcM.p1 === 'WALKOVER') return srcM.p2;
        // Check Firebase result
        const w = getWinner(srcMatch);
        if (w === 'NO_SHOW') return 'BYE (No Show)';
        return w || pStr;
    }
    return pStr;
}

function render() {
    if (currentView === 'dashboard') renderDashboard();
    else renderCategory(currentView);
}

function renderDashboard() {
    const el = document.getElementById('content');
    const realMatches = MATCHES.filter(m=>m.p2!=='WALKOVER');
    let totalDone = 0;
    realMatches.forEach(m => { if (getWinner(m.n)) totalDone++; });
    const totalMatches = realMatches.length;

    let html = '<div class="stat-row">';
    html += '<div class="stat-item"><div class="stat-number">'+totalMatches+'</div><span>Total Matches</span></div>';
    html += '<div class="stat-item"><div class="stat-number" style="color:#22c55e">'+totalDone+'</div><span>Completed</span></div>';
    html += '<div class="stat-item"><div class="stat-number" style="color:#3b82f6">'+(totalMatches-totalDone)+'</div><span>Remaining</span></div>';
    html += '</div>';

    html += '<div class="dashboard">';

    // Upcoming Matches (next 10 pending matches by time)
    html += '<div class="dash-card"><h3>&#127942; Upcoming Matches</h3>';
    const upcoming = realMatches.filter(m=>!getWinner(m.n)).slice(0,10);
    if (upcoming.length === 0) {
        html += '<div style="text-align:center;color:#4ade80;font-size:1rem;padding:20px">All matches completed!</div>';
    } else {
        upcoming.forEach(m => {
            const p1 = resolvePlayer(m.p1, m.n), p2 = resolvePlayer(m.p2, m.n);
            html += '<div class="dash-item" style="flex-wrap:wrap;gap:4px">';
            html += '<span style="color:#f59e0b;font-weight:600;min-width:70px">'+m.t+'</span>';
            html += '<span style="color:#64748b;min-width:55px">Ct '+m.c+'</span>';
            html += '<span style="flex:1">'+p1+' <span style="color:#64748b">vs</span> '+p2+'</span>';
            html += '<span class="badge badge-upcoming">'+CAT_NAMES[m.cat]+'</span>';
            html += '</div>';
        });
    }
    html += '</div>';

    // Full Schedule by Time Slot
    html += '<div class="dash-card"><h3>&#128197; Schedule by Time Slot</h3>';
    const timeSlots = [...new Set(MATCHES.filter(m=>m.t!=='W/O').map(m=>m.t))];
    timeSlots.forEach(t => {
        const slotM = MATCHES.filter(m=>m.t===t && m.p2!=='WALKOVER');
        const doneCount = slotM.filter(m=>getWinner(m.n)).length;
        const total = slotM.length;
        let badge;
        if (doneCount === total) badge = '<span class="badge badge-done">Done</span>';
        else if (doneCount > 0) badge = '<span class="badge badge-live">In Progress</span>';
        else badge = '<span class="badge badge-upcoming">Upcoming</span>';
        html += '<div class="dash-item">';
        html += '<span style="font-weight:600;min-width:80px">'+t+'</span>';
        html += '<span style="color:#94a3b8">'+doneCount+'/'+total+' matches</span>';
        html += badge;
        html += '</div>';
    });
    html += '</div>';

    // Recently Completed
    html += '<div class="dash-card"><h3>&#9989; Recently Completed</h3>';
    const completed = realMatches.filter(m=>getWinner(m.n)).slice(-8).reverse();
    if (completed.length === 0) {
        html += '<div style="color:#64748b;padding:10px">No matches completed yet</div>';
    } else {
        completed.forEach(m => {
            const winner = getWinner(m.n);
            html += '<div class="dash-item">';
            html += '<span style="color:#4ade80;font-weight:600">'+winner+'</span>';
            html += '<span class="badge" style="background:#334155;color:#94a3b8">'+m.r+'</span>';
            html += '</div>';
        });
    }
    html += '</div>';

    html += '</div>';
    el.innerHTML = html;
}

function renderCategory(cat) {
    const el = document.getElementById('content');
    const catM = MATCHES.filter(m => m.cat === cat);
    
    // Group by round in sequence
    const grouped = {};
    ROUND_ORDER.forEach(r => { grouped[r] = []; });
    catM.forEach(m => { if (grouped[m.r]) grouped[m.r].push(m); });
    
    let html = '';
    ROUND_ORDER.forEach(round => {
        const matches = grouped[round];
        if (!matches || matches.length === 0) return;
        
        html += '<div class="round-section">';
        html += '<div class="round-title '+ROUND_CLASS[round]+'">'+round+' ('+matches.length+' matches)</div>';
        
        matches.forEach(m => {
            const p1 = resolvePlayer(m.p1, m.n);
            const p2 = resolvePlayer(m.p2, m.n);
            const winner = getWinner(m.n);
            const scores = getScores(m.n);
            const isWO = m.p2 === 'WALKOVER';
            const isNoShow = winner === 'NO_SHOW';
            const cardClass = isWO ? 'match-card walkover' : isNoShow ? 'match-card walkover' : winner ? 'match-card has-winner' : 'match-card';
            
            html += '<div class="'+cardClass+'">';
            html += '<div class="match-header"><span>M#'+m.n+' | '+m.t+' | Court '+m.c+'</span>';
            if (isNoShow) html += '<span class="badge" style="background:#ef4444;color:#fff">No Show</span>';
            else if (winner) html += '<span class="badge badge-done">Completed</span>';
            else if (!isWO) html += '<span class="badge badge-live">Pending</span>';
            else html += '<span class="badge" style="background:#f59e0b;color:#fff">Walkover</span>';
            html += '</div>';
            
            html += '<div class="match-players">';
            const p1Class = 'player p1'+(winner===p1?' winner':'')+(isAdmin && !isWO && !isNoShow?' clickable':'');
            const p2Class = 'player p2'+(winner===p2?' winner':'')+(isAdmin && !isWO && p2!=='WALKOVER' && !isNoShow?' clickable':'');
            const p1Click = isAdmin && !isWO && !isNoShow ? ' onclick="setWinner('+m.n+',\''+p1.replace(/'/g,"\\'")+'\')"' : '';
            const p2Click = isAdmin && !isWO && p2!=='WALKOVER' && !isNoShow ? ' onclick="setWinner('+m.n+',\''+p2.replace(/'/g,"\\'")+'\')"' : '';
            
            html += '<div class="'+p1Class+'"'+p1Click+'>'+(isNoShow?'<s>'+p1+'</s>':p1)+'</div>';
            html += '<div class="vs">VS</div>';
            html += '<div class="'+p2Class+'"'+p2Click+'>'+(isNoShow?'<s>'+p2+'</s>':p2)+'</div>';
            html += '</div>';
            
            // No Show button (admin only, non-walkover, no winner yet OR already no-show for undo)
            if (isAdmin && !isWO && (!winner || isNoShow)) {
                html += '<div style="text-align:center;margin-top:6px">';
                html += '<button onclick="setNoShow('+m.n+')" style="padding:4px 12px;border:none;border-radius:4px;font-size:0.7rem;cursor:pointer;'+(isNoShow?'background:#22c55e;color:#fff':'background:#ef4444;color:#fff')+'">'+(isNoShow?'Undo No Show':'Both No Show')+'</button>';
                html += '</div>';
            }
            
            // Score inputs (admin only, non-walkover)
            if (!isWO) {
                html += '<div class="scores">';
                for (let s=1; s<=3; s++) {
                    const f1 = 's'+s+'p1', f2 = 's'+s+'p2';
                    const v1 = scores[f1]||'', v2 = scores[f2]||'';
                    if (isAdmin) {
                        html += '<div class="score-box"><div class="score-label">Set '+s+'</div>';
                        html += '<input class="score-input" value="'+v1+'" onchange="setScore('+m.n+',\''+f1+'\',this.value)" placeholder="-">';
                        html += '<span style="color:#64748b;font-size:0.7rem"> - </span>';
                        html += '<input class="score-input" value="'+v2+'" onchange="setScore('+m.n+',\''+f2+'\',this.value)" placeholder="-">';
                        html += '</div>';
                    } else if (v1 || v2) {
                        html += '<div class="score-box"><div class="score-label">Set '+s+'</div>';
                        html += '<span style="font-size:0.8rem;color:#e2e8f0">'+v1+'-'+v2+'</span></div>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
        });
        html += '</div>';
    });
    
    el.innerHTML = html;
}

// Initial render
render();
</script>
